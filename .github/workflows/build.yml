name: Build macOS App

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build .app
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version || true

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            AIVideoAssistant/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('AIVideoAssistant/Package.resolved', 'AIVideoAssistant/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build app bundle
        working-directory: AIVideoAssistant
        run: |
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh release

      - name: Verify bundle
        run: |
          ls -la AIVideoAssistant/dist
          plutil -lint "AIVideoAssistant/dist/AI视频助手.app/Contents/Info.plist"
          file "AIVideoAssistant/dist/AI视频助手.app/Contents/MacOS/AIVideoAssistant"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIVideoAssistant-macOS
          path: AIVideoAssistant/dist/AIVideoAssistant-macOS.zip
          if-no-files-found: error

      - name: Upload unpacked app
        uses: actions/upload-artifact@v4
        with:
          name: AIVideoAssistant-app
          path: AIVideoAssistant/dist/AI视频助手.app
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: AIVideoAssistant-macOS
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AIVideoAssistant-macOS.zip
          generate_release_notes: true
